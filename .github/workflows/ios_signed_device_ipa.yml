name: iOS Signed Device IPA

on:
  workflow_dispatch:
    inputs:
      flutter_channel:
        description: Flutter channel to use
        required: false
        default: stable
      build_flavor:
        description: Build flavor dart define
        required: false
        default: ios_device
      export_method:
        description: Xcode export method (ad-hoc, development, app-store)
        required: false
        default: ad-hoc
      upload_to_testflight:
        description: Upload resulting IPA to TestFlight (true/false)
        required: false
        default: "false"

jobs:
  signed-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.prox-us.prox
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Flutter project root
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          project_dir="$(git ls-files '**/pubspec.yaml' | grep -vE '(^|/)(build|.dart_tool|node_modules)/' | head -n 1 | xargs -I{} dirname {})"
          if [[ -z "${project_dir:-}" ]]; then
            echo "No pubspec.yaml found in repository checkout." >&2
            exit 1
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Detected Flutter project directory: $project_dir"

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ secrets.IOS_CERT_P12_BASE64 }}" ]] || { echo "Missing required secret: IOS_CERT_P12_BASE64" >&2; exit 1; }
          [[ -n "${{ secrets.IOS_CERT_PASSWORD }}" ]] || { echo "Missing required secret: IOS_CERT_PASSWORD" >&2; exit 1; }
          [[ -n "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" ]] || { echo "Missing required secret: IOS_PROVISION_PROFILE_BASE64" >&2; exit 1; }
          [[ -n "${{ secrets.IOS_TEAM_ID }}" ]] || { echo "Missing required secret: IOS_TEAM_ID" >&2; exit 1; }

          if [[ "${{ github.event.inputs.upload_to_testflight || 'false' }}" == "true" ]]; then
            [[ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" ]] || { echo "Missing required secret for TestFlight upload: APP_STORE_CONNECT_API_KEY_ID" >&2; exit 1; }
            [[ -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ]] || { echo "Missing required secret for TestFlight upload: APP_STORE_CONNECT_ISSUER_ID" >&2; exit 1; }
            [[ -n "${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}" ]] || { echo "Missing required secret for TestFlight upload: APP_STORE_CONNECT_API_KEY_P8_BASE64" >&2; exit 1; }
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          cache: true

      - name: Select Xcode with iOS 26+ SDK
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          xcode_apps=(/Applications/Xcode*.app)
          shopt -u nullglob

          if [[ ${#xcode_apps[@]} -eq 0 ]]; then
            echo "No Xcode app installations found under /Applications." >&2
            exit 1
          fi

          # Prefer an explicit Xcode 26+ install if available.
          selected=""
          for app in /Applications/Xcode_26*.app /Applications/Xcode_27*.app /Applications/Xcode_28*.app; do
            if [[ -d "$app" ]]; then
              selected="$app"
            fi
          done

          # Fall back to the newest installed Xcode if no 26+ naming match exists.
          if [[ -z "$selected" ]]; then
            selected="$(ls -1d /Applications/Xcode*.app | sort -V | tail -n 1)"
          fi

          echo "Using Xcode: $selected"
          sudo xcode-select -s "$selected/Contents/Developer"

          xcodebuild -version
          xcodebuild -showsdks

          if ! xcodebuild -showsdks | grep -Eq 'iphoneos(26|[3-9][0-9])'; then
            echo "iOS 26+ SDK is required for App Store Connect/TestFlight uploads." >&2
            exit 1
          fi

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Use CocoaPods (disable SwiftPM integration)
        run: flutter config --no-enable-swift-package-manager

      - name: Install signing certificate and provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          CERT_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$CERT_DIR"

          echo -n "${{ secrets.IOS_CERT_P12_BASE64 }}" | base64 --decode > "$CERT_DIR/cert.p12"
          echo -n "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 --decode > "$CERT_DIR/profile.mobileprovision"

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security import "$CERT_DIR/cert.p12" -P "${{ secrets.IOS_CERT_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$RUNNER_TEMP" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$CERT_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$CERT_DIR/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build signed IPA
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_METHOD="${{ github.event.inputs.export_method || 'ad-hoc' }}"

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=PROX_TESTER=true \
            --dart-define=PROX_TESTER_BUILD=true \
            --dart-define=BUILD_FLAVOR=${{ github.event.inputs.build_flavor || 'ios_device' }}

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-signed-ipa
          path: |
            ${{ env.PROJECT_DIR }}/build/ios/ipa/*.ipa
            ${{ env.PROJECT_DIR }}/build/ios/archive/*.xcarchive
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload_to_testflight == 'true' }}
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event.inputs.export_method || 'ad-hoc' }}" != "app-store" ]]; then
            echo "TestFlight upload requires export_method=app-store." >&2
            exit 1
          fi

          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"

          API_KEY_ID="${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
          ISSUER_ID="${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${API_KEY_ID}.p8"

          echo -n "${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          IPA_PATH="$(ls -1 build/ios/ipa/*.ipa | head -n 1)"
          if [[ -z "${IPA_PATH:-}" ]]; then
            echo "No IPA found at build/ios/ipa/*.ipa" >&2
            exit 1
          fi

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
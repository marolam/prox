# Prox Android build settings
# IMPORTANT: AGP/Gradle for this project expects JDK 17+.
# If builds fail with "Unsupported class file major version" or toolchain errors:
# - In Android Studio: Settings > Build Tools > Gradle > Gradle JDK = 17 (or embedded JBR 17)
# - Or set JAVA_HOME to a JDK 17 install for your shell before running gradlew/Flutter.

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Performance / stability
# Windows safeguard: avoid intermittent file-mode cache packing failures
# on tasks like :app:compressDebugAssets.
org.gradle.caching=false
org.gradle.parallel=true

android.useAndroidX=true
android.enableJetifier=true

# Slightly safer + faster builds for modern AGP
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Optional: silence "unsupported compileSdk" warnings when pinning API 35
android.suppressUnsupportedCompileSdk=35

# Set by rr_uninstall_build_release_install_launch
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.16.8-hotspot
